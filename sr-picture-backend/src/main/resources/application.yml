server:
  port: 8123
  servlet:
    context-path: /api
    #cookie30天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: sr-picture-backend
  profiles:
    active: local
  datasource:
    driver-class-name: ${sr.datasource.driver-class-name}
    url: ${sr.datasource.url}
    username: ${sr.datasource.username}
    password: ${sr.datasource.password}
  redis:
    database: 0
    host: ${sr.redis.host}
    port: ${sr.redis.port}
    timeout: 5000
  #session配置
  session:
    store-type: redis
    #30天过期
    timeout: 2592000
  servlet:
    multipart:
      max-file-size: 10MB
